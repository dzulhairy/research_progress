name: Build Research Progress PDF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "activities.json"
      - "assets/**"
      - "scripts/build-pdf.mjs"
      - ".github/workflows/build-pdf.yml"

permissions:
  contents: read

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/research-progress-http.log 2>&1 &
          echo $! > /tmp/research-progress-http.pid
          sleep 2

      - name: Build A4 PDF
        run: node scripts/build-pdf.mjs

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: DrPH-Research-Progress-PDF
          path: output/DrPH_Research_Progress_Dzul_Hairy.pdf
          if-no-files-found: error
          retention-days: 90
