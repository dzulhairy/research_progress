name: Generate Arabic MP3 audio

on:
  push:
    paths:
      - '.github/workflows/generate-arabic-audio.yml'
      - 'scripts/generate-arabic-audio.py'
      - 'scripts/arabic-audio-texts.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install speech tools
        run: |
          python -m pip install 'edge-tts>=7,<8' 'gTTS>=2.5,<3'
          if ! command -v ffprobe; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Generate and validate all Arabic clips
        run: python scripts/generate-arabic-audio.py arabic-audio
      - uses: actions/upload-artifact@v4
        with:
          name: jom-arab-mp3
          path: arabic-audio/
          retention-days: 3
          if-no-files-found: error
